    const normalizeStr = (str) => {

    function getWrongCharacterIndexes(input, expected) {
      const a = input || "", b = expected || "";
      const dp = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
      for (let i = 0; i <= a.length; i++) dp[i][0] = i;
      for (let j = 0; j <= b.length; j++) dp[0][j] = j;
      for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
        dp[i][j] = a[i - 1].toLowerCase() === b[j - 1].toLowerCase() ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
      }
      const wrong = new Set(); let i = a.length, j = b.length;
      while (i > 0 || j > 0) {
        if (i > 0 && j > 0 && a[i - 1].toLowerCase() === b[j - 1].toLowerCase() && dp[i][j] === dp[i - 1][j - 1]) { i--; j--; continue; }
        if (i > 0 && j > 0 && dp[i][j] === dp[i - 1][j - 1] + 1) { wrong.add(i - 1); i--; j--; continue; }
        if (i > 0 && dp[i][j] === dp[i - 1][j] + 1) { wrong.add(i - 1); i--; continue; }
        j--;
      }
      return wrong;
    }

        utterance.lang = 'en-US';
        utterance.rate = rate;
        
        const voices = window.speechSynthesis.getVoices();
        const preferredVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha')));
        if (preferredVoice) utterance.voice = preferredVoice;

        window.speechSynthesis.speak(utterance);
      }
    };

      const palettes = [

    function useEnterToNext(enabled, next) {
      useEffect(() => {
        const onKeyDown = (event) => {
          if (event.key !== 'Enter' || !enabled || event.isComposing) return;
          event.preventDefault();
          next();
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [enabled, next]);

                currentMode === "fill"
                  ? "bg-indigo-600 border-indigo-400 text-white shadow-lg shadow-indigo-600/30"
                  : "bg-slate-800/90 border-slate-700/80 text-slate-300 hover:bg-slate-700/80"
              }`}
            >
              <i className="fa-solid fa-pen-to-square text-indigo-300"></i>
              穴埋め
            </button>

            <button
              onClick={() => setCurrentMode("ordering")}
              className={`p-3 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition border ${
                currentMode === "ordering"
                  ? "bg-indigo-600 border-indigo-400 text-white shadow-lg shadow-indigo-600/30"
                  : "bg-slate-800/90 border-slate-700/80 text-slate-300 hover:bg-slate-700/80"
              }`}
            >
              <i className="fa-solid fa-arrow-down-short-wide text-indigo-300"></i>
              並べ替え
            </button>

            <button
              onClick={() => setCurrentMode("position")}
              className={`p-3 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition border ${
                currentMode === "position"
                  ? "bg-teal-600 border-teal-400 text-white shadow-lg shadow-teal-600/30"
                  : "bg-slate-800/90 border-slate-700/80 text-slate-300 hover:bg-slate-700/80"
              }`}
            >
              <i className="fa-solid fa-list-ol text-teal-300"></i>
              語順位置当て
            </button>

            <button
              onClick={() => setCurrentMode("error")}
              className={`p-3 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition border ${
                currentMode === "error"
                  ? "bg-rose-600 border-rose-400 text-white shadow-lg shadow-rose-600/30"
                  : "bg-slate-800/90 border-slate-700/80 text-slate-300 hover:bg-slate-700/80"
              }`}
            >
              <i className="fa-solid fa-bug text-rose-300"></i>
              誤り指摘
            </button>

            <button
              onClick={() => setCurrentMode("random")}
              className={`p-3 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition border ${
                currentMode === "random"
                  ? "bg-purple-600 border-purple-400 text-white shadow-lg shadow-purple-600/30"
                  : "bg-slate-800/90 border-slate-700/80 text-slate-300 hover:bg-slate-700/80"
              }`}
            >
              <i className="fa-solid fa-dice text-purple-300"></i>
              ランダム
            </button>

            <button
              onClick={() => setCurrentMode("mistakes")}
              className={`p-3 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition border relative ${
                currentMode === "mistakes"
                  ? "bg-amber-600 border-amber-400 text-white shadow-lg shadow-amber-600/30"
                  : "bg-slate-800/90 border-slate-700/80 text-slate-300 hover:bg-slate-700/80"
              }`}
            >
              <i className="fa-solid fa-rotate-left text-amber-300"></i>
              間違え直し
              {mistakes.length > 0 && (
                <span className="ml-1 px-1.5 py-0.5 text-[10px] bg-amber-500 text-slate-950 font-black rounded-full">
                  {mistakes.length}
                </span>
              )}
            </button>

            <button onClick={() => setCurrentMode("japaneseQuiz")} className={`p-3 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition border ${currentMode === "japaneseQuiz" ? "bg-amber-600 border-amber-400 text-white shadow-lg" : "bg-slate-800/90 border-slate-700/80 text-slate-300 hover:bg-slate-700/80"}`}><i className="fa-solid fa-language text-amber-300"></i>日本語穴埋め（4択）</button>
            <button onClick={() => setCurrentMode("japaneseMemory")} className={`p-3 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition border ${currentMode === "japaneseMemory" ? "bg-pink-600 border-pink-400 text-white shadow-lg" : "bg-slate-800/90 border-slate-700/80 text-slate-300 hover:bg-slate-700/80"}`}><i className="fa-solid fa-brain text-pink-300"></i>日本語暗記</button>

            <button
              onClick={() => setCurrentMode("flashcards")}
              className={`p-3 rounded-xl font-bold text-xs sm:text-sm flex items-center justify-center gap-2 transition border ${
                currentMode === "flashcards"
                  ? "bg-emerald-600 border-emerald-400 text-white shadow-lg shadow-emerald-600/30"
                  : "bg-slate-800/90 border-slate-700/80 text-slate-300 hover:bg-slate-700/80"
              }`}
            >
              <i className="fa-solid fa-volume-high text-emerald-300"></i>
              暗記 (音声)
            </button>
          </nav>

          {/* Mode Area */}
          <main className="relative z-10 flex-1 flex flex-col">
            {currentMode === "fill" && (
              <FillInMode
                questions={filteredQuestions}
                addMistake={addMistake}
                removeMistake={removeMistake}
                recordResult={recordResult}
              />
            )}

            {currentMode === "ordering" && (
              <WordOrderingMode
                questions={filteredQuestions}
                addMistake={addMistake}
                removeMistake={removeMistake}
                recordResult={recordResult}
              />
            )}

            {currentMode === "position" && (
              <WordPositionMode
                questions={filteredQuestions}
                addMistake={addMistake}
                removeMistake={removeMistake}
                recordResult={recordResult}
              />
            )}

            {currentMode === "error" && (
              <ErrorSpottingMode
                questions={filteredQuestions}
                addMistake={addMistake}
                removeMistake={removeMistake}
                recordResult={recordResult}
              />
            )}

            {currentMode === "random" && (
              <RandomQuizMode
                questions={filteredQuestions}
                addMistake={addMistake}
                removeMistake={removeMistake}
                recordResult={recordResult}
              />
            )}

            {currentMode === "mistakes" && (
              <MistakeReviewMode
                allQuestions={QUESTIONS_DATA}
                mistakeIds={mistakes}
                removeMistake={removeMistake}
                clearAllMistakes={() => setMistakes([])}
                recordResult={recordResult}
              />
            )}

            {currentMode === "japaneseQuiz" && <JapaneseChoiceMode items={japaneseItems} recordResult={recordResult} />}
            {currentMode === "japaneseMemory" && <JapaneseMemoryMode items={japaneseItems} />}

            {currentMode === "flashcards" && (
              <FlashcardMode
                questions={filteredQuestions}
                mastered={mastered}
                toggleMastered={toggleMastered}
              />
            )}
          </main>
          {cerberusRunning && <CerberusRunner />}
        </div>
      );
    }

    function JapaneseChoiceMode({ items, recordResult }) {
      const [index, setIndex] = useState(0);
      const [selected, setSelected] = useState(null);
      const q = items[index];
      useEffect(() => { setIndex(0); setSelected(null); }, [items]);
      useEffect(() => { setSelected(null); }, [index, q]);
      useEnterToNext(selected !== null, () => { if (index < items.length - 1) setIndex(index + 1); });
      if (!q) return <div className="bg-slate-800 rounded-2xl p-10 text-center text-slate-200">このページの文法項目はありません。</div>;
      const answer = i => {
        if (selected !== null) return;
        setSelected(i);
        const ok = q.choices[i] === q.answer;
        recordResult(ok);
      };
      const next = () => { if (index < items.length - 1) setIndex(index + 1); };
      return <section className="bg-slate-800/95 border border-amber-400/60 rounded-2xl p-5 sm:p-8 shadow-xl">
        <div className="flex justify-between items-center gap-3 mb-5"><span className="px-3 py-1.5 rounded-lg bg-amber-950 text-amber-200 font-bold text-sm">添付資料の青字文法だけ</span><span className="text-slate-300 text-sm">{index + 1} / {items.length}</span></div>
        <div className="flex items-center justify-between gap-3 rounded-2xl bg-slate-950 p-5 mb-5"><p className="text-xl sm:text-3xl font-bold leading-loose text-white">{q.prompt}</p><DogSticker seed={q.page + index} size={100} /></div>
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">{q.choices.map((opt, i) => <button key={`${opt}-${i}`} onClick={() => answer(i)} disabled={selected !== null} className={`p-4 rounded-xl border-2 text-left text-lg font-bold flex gap-3 items-center ${selected === null ? "bg-slate-900 border-slate-600 text-white hover:border-amber-400" : opt === q.answer ? "bg-emerald-950 border-emerald-400 text-emerald-100" : i === selected ? "bg-rose-950 border-rose-400 text-rose-100" : "bg-slate-900 border-slate-700 text-slate-500"}`}><span className="bg-slate-700 px-2.5 py-1 rounded-lg text-sm">{String.fromCharCode(65+i)}</span>{opt}</button>)}</div>
        {selected !== null && <div className="mt-5 p-4 rounded-xl bg-slate-950 border border-slate-600 text-white"><div className="font-bold text-emerald-300">{q.choices[selected] === q.answer ? "正解！" : `正解は「${q.answer}」です。`}</div><p className="text-xs text-slate-400 mt-2">Enterキーでも次の問題へ進めます。</p></div>}
        <div className="flex justify-end mt-6"><button onClick={next} disabled={index === items.length-1} className="px-5 py-3 rounded-xl bg-amber-600 text-white font-bold disabled:opacity-40">次へ →</button></div>
      </section>;
    }

    function JapaneseMemoryMode({ items }) {
      const [view, setView] = useState("cards");
      const [index, setIndex] = useState(0);
      const [revealed, setRevealed] = useState(false);
      const q = items[index];
      useEffect(() => { setIndex(0); setRevealed(false); }, [items]);
      useEffect(() => { setRevealed(false); }, [index, q]);
      const next = () => { if (index < items.length-1) setIndex(index+1); };
      useEnterToNext(view === "cards" && revealed, next);
      if (!q) return <div className="bg-slate-800 rounded-2xl p-10 text-center text-slate-200">このページの文法項目はありません。</div>;
      return <section className="bg-slate-800/95 border border-pink-400/60 rounded-2xl p-5 sm:p-8 shadow-xl">
        <div className="flex flex-wrap justify-between items-center gap-3 mb-5"><span className="px-3 py-1.5 rounded-lg bg-pink-950 text-pink-200 font-bold">日本語暗記</span><div className="flex gap-2"><button onClick={() => setView("cards")} className={`px-4 py-2 rounded-lg text-sm font-bold ${view === "cards" ? "bg-pink-600 text-white" : "bg-slate-700 text-slate-200"}`}>カード</button><button onClick={() => setView("list")} className={`px-4 py-2 rounded-lg text-sm font-bold ${view === "list" ? "bg-pink-600 text-white" : "bg-slate-700 text-slate-200"}`}>一覧表</button></div></div>
        {view === "list" ? <div className="overflow-x-auto rounded-xl border border-slate-600"><table className="w-full text-left border-collapse"><thead className="bg-slate-950 text-pink-200"><tr><th className="p-3 whitespace-nowrap">ページ</th><th className="p-3 min-w-72">青字の文法説明</th><th className="p-3 whitespace-nowrap">答え</th></tr></thead><tbody>{items.map((item,i)=><tr key={item.id} className={i%2 ? "bg-slate-800" : "bg-slate-900"}><td className="p-3 text-slate-300 whitespace-nowrap">P.{item.page}</td><td className="p-3 text-white">{item.prompt.replace("＿＿＿", "（　　　）")}</td><td className="p-3 text-pink-200 font-extrabold whitespace-nowrap">{item.answer}</td></tr>)}</tbody></table></div> : <>
          <div className="text-right text-slate-300 text-sm mb-3">{index+1} / {items.length}</div>
          <div className="min-h-72 rounded-2xl bg-slate-950 border border-slate-600 p-6 sm:p-10 flex flex-col items-center justify-center text-center"><DogSticker seed={q.page + index} size={132} /><p className="mt-4 text-xl sm:text-3xl font-bold leading-loose text-white">{revealed ? q.prompt.replace("＿＿＿", q.answer) : q.prompt}</p>{!revealed ? <button onClick={() => setRevealed(true)} className="mt-6 px-6 py-3 rounded-xl bg-pink-600 text-white font-bold">答えを見る</button> : <p className="mt-4 text-pink-200 font-bold">答え：{q.answer}</p>}</div>
          <div className="flex justify-between items-center mt-6"><button onClick={() => setIndex(Math.max(0,index-1))} disabled={index===0} className="px-4 py-3 rounded-xl bg-slate-700 text-white font-bold disabled:opacity-40">← 前へ</button><span className="text-xs text-slate-400">答えを見たら Enter で次へ</span><button onClick={next} disabled={index===items.length-1} className="px-5 py-3 rounded-xl bg-pink-600 text-white font-bold disabled:opacity-40">次へ →</button></div>
        </>}
      </section>;
    }

    function CerberusRunner() {
      return <div className="cerberus-runner" aria-label="人や動物を追いかけて画面を走る三つ首のケルベロス犬" role="img"><svg viewBox="0 0 430 210" width="100%" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="166" cy="169" rx="120" ry="12" fill="#020617" opacity=".32"/>
        <path d="M80 112 Q104 82 190 90 Q242 91 273 120 L259 150 107 151Z" fill="#b86e37" stroke="#512d1c" strokeWidth="5"/><path d="M99 103 Q71 85 61 105 Q76 116 100 114Z" fill="#8b4f2c" stroke="#512d1c" strokeWidth="4"/>
        <path d="M121 142 105 177 119 180 143 151 M211 142 228 176 242 175 238 137" fill="#9a5731" stroke="#512d1c" strokeWidth="5" strokeLinejoin="round"/><path d="M110 176h17 M226 176h18" stroke="#f3d0a0" strokeWidth="6" strokeLinecap="round"/>
        <path d="M125 97 Q111 58 100 48 M165 94 Q162 49 165 39 M205 98 Q221 59 233 48" fill="none" stroke="#b86e37" strokeWidth="18" strokeLinecap="round"/>
        {[{x:90,y:42},{x:165,y:31},{x:242,y:42}].map((h,i)=><g key={i}><path d={`M${h.x-22} ${h.y+8} Q${h.x-38} ${h.y-13} ${h.x-25} ${h.y-27} Q${h.x-9} ${h.y-24} ${h.x-6} ${h.y-7} M${h.x+20} ${h.y+8} Q${h.x+37} ${h.y-13} ${h.x+24} ${h.y-27} Q${h.x+9} ${h.y-24} ${h.x+6} ${h.y-7}`} fill="#874a2a" stroke="#512d1c" strokeWidth="4"/><ellipse cx={h.x} cy={h.y} rx="27" ry="24" fill="#d99554" stroke="#512d1c" strokeWidth="4"/><ellipse cx={h.x-9} cy={h.y-3} rx="3" ry="4" fill="#211713"/><ellipse cx={h.x+9} cy={h.y-3} rx="3" ry="4" fill="#211713"/><ellipse cx={h.x} cy={h.y+10} rx="8" ry="6" fill="#f5d9b6"/><ellipse cx={h.x} cy={h.y+8} rx="4" ry="3" fill="#211713"/><ellipse cx={h.x} cy={h.y+17} rx="8" ry="6" fill="#43211b"/><path d={`M${h.x-5} ${h.y+12} l3 4 3-4 M${h.x-5} ${h.y+22} l3-4 3 4`} fill="#fff7ed" stroke="#fff7ed" strokeWidth="1"/><path d={`M${h.x-16} ${h.y-24} l-7-10 M${h.x+16} ${h.y-24} l7-10`} stroke="#f4e7d4" strokeWidth="4" strokeLinecap="round"/><path d={`M${h.x-16} ${h.y-9} l8 3 M${h.x+16} ${h.y-9} l-8 3`} stroke="#512d1c" strokeWidth="3" strokeLinecap="round"/></g>)}
        <path d="M143 105 Q170 93 195 105 L188 119 150 119Z" fill="#fbbf24" stroke="#713f12" strokeWidth="3"/><circle cx="170" cy="111" r="5" fill="#fff7ed"/>
        <g transform="translate(286 82)" stroke="#1e293b" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><circle cx="19" cy="15" r="11" fill="#f6c7a5"/><path d="M15 28 5 58 32 58 25 29Z" fill="#60a5fa"/><path d="M13 56 5 83 M26 56 38 79 M10 37 -2 53 M27 37 39 45" fill="none"/><path d="M13 12 Q20 15 26 12" fill="none"/><text x="1" y="4" fontSize="13" stroke="none" fill="#fef08a">わー！</text></g>
        <g transform="translate(366 123)" stroke="#334155" strokeWidth="3"><path d="M0 9 Q15 -4 30 9 Q18 22 0 9Z" fill="#f8fafc"/><circle cx="18" cy="7" r="2" fill="#0f172a"/><path d="M28 9 38 13 28 15Z" fill="#fb923c"/><path d="M11 19v8m8-8v8"/></g>
        <g transform="translate(340 153)" stroke="#334155" strokeWidth="3" strokeLinecap="round"><path d="M0 14 Q8 -2 26 8 L33 18 25 25 4 23Z" fill="#94a3b8"/><path d="M27 8 34 0 37 13" fill="#94a3b8"/><circle cx="24" cy="9" r="2" fill="#0f172a"/><path d="M6 22 1 30m19-8 4 8"/></g>
      </svg></div>;
    }

    // ----------------------------------------------------
    // Mode 1: Fill-In (Phrase & 1-Word Fill)
    // ----------------------------------------------------
    function FillInMode({ questions, addMistake, removeMistake, recordResult }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [fillType, setFillType] = useState("phrase");
      const [userAnswers, setUserAnswers] = useState({});
      const [feedback, setFeedback] = useState({});
      const [showHint, setShowHint] = useState(false);
      const [showErrorMarkers, setShowErrorMarkers] = useState({});
      const [isRandomOrder, setIsRandomOrder] = useState(false);
      const [shuffledQuestions, setShuffledQuestions] = useState([]);
      const answerInputRef = useRef(null);

      useEffect(() => {
        if (isRandomOrder) {
          setShuffledQuestions([...questions].sort(() => Math.random() - 0.5));
        } else {
          setShuffledQuestions(questions);
        }
        setCurrentIndex(0);
      }, [questions, isRandomOrder]);

      const activeQuestions = isRandomOrder ? shuffledQuestions : questions;
      const q = activeQuestions?.[currentIndex] || activeQuestions?.[0];
      const answerKey = q ? `${q.id}-${fillType}` : '';
      const isAnswered = !!q && feedback[answerKey] !== undefined;
      useEffect(() => {
        if (q && !feedback[answerKey]) {
          answerInputRef.current?.focus();
          answerInputRef.current?.select();
        }
      }, [q?.id, currentIndex, fillType]);
      useEnterToNext(isAnswered, () => {
        if (currentIndex < activeQuestions.length - 1) setCurrentIndex(currentIndex + 1);
      });

      const result = feedback[answerKey];

      const targetWord = q?.targetWord || q?.hint?.split('/')[0]?.trim() || "is";
      const maskedSentence = useMemo(() => {
        if (!q?.en || !targetWord) return q?.en || '';
        const regex = new RegExp(`\\b${targetWord}\\b`, "i");
        return q.en.replace(regex, "[ _____ ]");
      }, [q, targetWord]);

      if (!activeQuestions || activeQuestions.length === 0) {
        return (
          <div className="bg-slate-800/80 border border-slate-700 rounded-2xl p-12 text-center text-slate-400">
            <i className="fa-solid fa-filter-circle-xmark text-4xl mb-3 text-slate-500"></i>
            <p className="font-semibold">該当する問題がありません。フィルターを変更してください。</p>
          </div>
        );
      }



      const handleCheck = (e) => {
        if (e) e.preventDefault();
        const input = (userAnswers[answerKey] || "").trim();
        if (!input) return;

        let isCorrect = false;

        if (fillType === "oneWord") {
          isCorrect = normalizeStr(input) === normalizeStr(targetWord);
        } else {
          isCorrect = 
            normalizeStr(input) === normalizeStr(q.en) ||
            (q.blankTarget && normalizeStr(input) === normalizeStr(q.blankTarget));
        }

        setFeedback(prev => ({ ...prev, [answerKey]: isCorrect }));
        recordResult(isCorrect);

        if (!isCorrect) {
          addMistake(q.id);
        } else {
          removeMistake(q.id);
          speakText(q.en);
        }
      };

      const handleNext = () => {
        setShowHint(false);
        if (currentIndex < activeQuestions.length - 1) {
          setCurrentIndex(prev => prev + 1);
        }
      };

      const handlePrev = () => {
        setShowHint(false);
        if (currentIndex > 0) {
          setCurrentIndex(prev => prev - 1);
        }
      };

      return (
        <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-4 sm:p-8 shadow-xl flex flex-col justify-between flex-1">
          <div>
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-700/60 mb-6">
              <div className="flex items-center gap-2">
                <span className="bg-slate-700 text-indigo-300 font-bold text-xs px-3 py-1 rounded-md">
                  P.{q.page} - {q.num}
                </span>
                <span className={`text-xs px-2.5 py-1 rounded-md font-bold uppercase ${
                  q.type === 'basic' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-sky-950 text-sky-400 border border-sky-800'
                }`}>
                  {q.type === 'basic' ? '基本文' : '英訳演習'}
                </span>
              </div>

              <div className="flex flex-wrap items-center gap-2 self-start sm:self-auto">
                <button
                  onClick={() => setIsRandomOrder(!isRandomOrder)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 border ${
                    isRandomOrder
                      ? "bg-purple-600 border-purple-400 text-white shadow"
                      : "bg-slate-900 border-slate-700 text-slate-400 hover:text-slate-200"
                  }`}
                >
                  <i className="fa-solid fa-shuffle"></i>
                  {isRandomOrder ? "出題順: ランダム" : "出題順: 順番通り"}
                </button>

                <div className="flex items-center bg-slate-900 rounded-xl p-1 border border-slate-700 text-xs font-bold">
                  <button
                    onClick={() => setFillType("phrase")}
                    className={`px-3 py-1.5 rounded-lg transition ${
                      fillType === "phrase"
                        ? "bg-indigo-600 text-white shadow"
                        : "text-slate-400 hover:text-slate-200"
                    }`}
                  >
                    📝 フレーズ・全文穴埋め
                  </button>
                  <button
                    onClick={() => setFillType("oneWord")}
                    className={`px-3 py-1.5 rounded-lg transition ${
                      fillType === "oneWord"
                        ? "bg-indigo-600 text-white shadow"
                        : "text-slate-400 hover:text-slate-200"
                    }`}
                  >
                    🔤 1単語穴埋め
                  </button>
                </div>
              </div>
            </div>

            <div className="space-y-4 mb-6">
              <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">日本語訳</div>
              <div className="flex items-center justify-between gap-3"><h2 className="text-xl sm:text-2xl font-bold text-slate-100 leading-relaxed">{q.jp}</h2><DogForQuestion q={q} /></div>

              {fillType === "oneWord" && (
                <div className="p-4 bg-slate-900 border border-slate-700/80 rounded-xl">
                  <div className="text-xs font-bold text-indigo-400 mb-1">虫食い英文:</div>
                  <div className="flex items-center justify-between gap-3"><p className="text-lg sm:text-xl font-bold font-mono text-slate-200">{maskedSentence}</p><DogForQuestion q={q} size={58} /></div>
                </div>
              )}

              {fillType === "phrase" && q.hint && (
                <div className="flex items-center gap-2">
                  <span className="bg-slate-900/90 text-amber-300 border border-amber-500/30 font-mono text-sm px-3 py-1.5 rounded-lg">
                    指定語句: [{q.hint}]
                  </span>
                  {!showHint && (
                    <button
                      onClick={() => setShowHint(true)}
                      className="text-xs text-slate-400 hover:text-slate-200 underline"
                    >
                      ヒントを表示
                    </button>
                  )}
                </div>
              )}

              {fillType === "phrase" && showHint && q.blankTarget && (
                <div className="p-3 bg-amber-950/40 border border-amber-500/30 text-amber-200 text-xs sm:text-sm rounded-xl">
                  💡 指定部分フレーズ: <span className="font-mono font-bold text-amber-300">{q.blankTarget}</span>
                </div>
              )}
            </div>

            <form onSubmit={handleCheck} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-400 mb-2">
                  {fillType === "oneWord"
                    ? `空欄 [ _____ ] に当てはまる1単語を半角英語で入力してください:`
                    : `英語を入力してください（全文またはキーフレーズに対応）:`}
                </label>
                <input
                  ref={answerInputRef}
                  type="text"
                  value={userAnswers[answerKey] || ""}
                  onChange={(e) => setUserAnswers({ ...userAnswers, [answerKey]: e.target.value })}
                  placeholder={fillType === "oneWord" ? "例: because" : "英文または語句を入力..."}
                  disabled={isAnswered}
                  className="w-full bg-slate-900 border-2 border-slate-700 focus:border-indigo-500 rounded-xl px-4 py-3.5 text-base sm:text-lg text-white placeholder-slate-500 outline-none transition"
                  autoFocus
                />
              </div>

              {!isAnswered && (
                <button
                  type="submit"
                  disabled={!(userAnswers[answerKey] || "").trim()}
                  className="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 text-base"
                >
                  <i className="fa-solid fa-check"></i> 判定する
                </button>
              )}
            </form>

            {isAnswered && (
              <div className={`mt-6 p-5 rounded-xl border ${
                result ? "bg-emerald-950/60 border-emerald-500/50 text-emerald-200" : "bg-rose-950/60 border-rose-500/50 text-rose-200"
              }`}>
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center gap-2 font-bold text-lg">
                    {result ? (
                      <>
                        <i className="fa-solid fa-circle-check text-emerald-400 text-xl"></i>
                        <span className="text-emerald-400">正解です！ Great job!</span>
                      </>
                    ) : (
                      <>
                        <i className="fa-solid fa-circle-xmark text-rose-400 text-xl"></i>
                        <span className="text-rose-400">不正解... もう一度確認！</span>
                      </>
                    )}
                  </div>

                  <button
                    onClick={() => speakText(q.en)}
                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold rounded-lg flex items-center gap-1.5 transition border border-slate-600"
                  >
                    <i className="fa-solid fa-volume-high text-indigo-400"></i> 音声再生
                  </button>
                </div>

                {!result && <div className="mb-4">
                  <button type="button" onClick={() => setShowErrorMarkers(prev => ({ ...prev, [answerKey]: !prev[answerKey] }))} className="px-4 py-2 rounded-lg bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold text-sm shadow"><i className="fa-solid fa-highlighter mr-2"></i>{showErrorMarkers[answerKey] ? "マーカーを消す" : "間違いにマーカー"}</button>
                  {showErrorMarkers[answerKey] && (() => {
                    const typed = userAnswers[answerKey] || "";
                    const candidates = fillType === "oneWord" ? [targetWord] : [q.blankTarget, q.en].filter(Boolean);
                    const expected = candidates.sort((a, b) => Math.abs(a.length - typed.length) - Math.abs(b.length - typed.length))[0] || q.en;
                    const wrongIndexes = getWrongCharacterIndexes(typed, expected);
                    return <div className="mt-3 p-3 bg-slate-950 border border-amber-400/60 rounded-lg"><div className="text-xs text-amber-200 font-bold mb-1">あなたの入力（赤い部分を確認）</div><p className="font-mono text-lg break-words">{typed.split("").map((char, index) => wrongIndexes.has(index) ? <mark key={index} className="bg-rose-500 text-white rounded-sm px-px">{char}</mark> : <span key={index}>{char}</span>)}</p><div className="text-xs text-slate-400 mt-2">正解: <span className="text-emerald-300 font-mono">{expected}</span></div></div>;
                  })()}
                </div>}
                <div className="space-y-2 text-sm sm:text-base">
                  {fillType === "oneWord" && (
                    <div>
                      <span className="text-slate-400 text-xs font-bold block">空欄の正解単語:</span>
                      <p className="font-bold text-amber-300 font-mono text-xl">{targetWord}</p>
                    </div>
                  )}
                  <div>
                    <span className="text-slate-400 text-xs font-bold block">全文英文:</span>
                    <div className="flex items-center justify-between gap-3"><p className="font-bold text-white font-mono text-base sm:text-lg">{q.en}</p><DogForQuestion q={q} size={58} /></div>
                  </div>
                </div>
              </div>
            )}
          </div>

          <div className="flex items-center justify-between mt-8 pt-4 border-t border-slate-700/60">
            <button
              onClick={handlePrev}
              disabled={currentIndex === 0}
              className="px-4 py-2.5 bg-slate-700 hover:bg-slate-600 disabled:opacity-40 text-slate-200 font-bold rounded-xl text-sm transition"
            >
              <i className="fa-solid fa-arrow-left"></i> 前へ
            </button>

            <span className="text-xs text-slate-400 font-bold">
              {currentIndex + 1} / {activeQuestions.length}
            </span>

            <button
              onClick={handleNext}
              disabled={currentIndex === activeQuestions.length - 1}
              className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white font-bold rounded-xl text-sm transition shadow-md shadow-indigo-600/20"
            >
              次へ <i className="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </div>
      );
    }

    // ----------------------------------------------------
    // Mode 2: Word Ordering
    // ----------------------------------------------------
    function WordOrderingMode({ questions, addMistake, removeMistake, recordResult }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [selectedChips, setSelectedChips] = useState([]);
      const [availableChips, setAvailableChips] = useState([]);
      const [isChecked, setIsChecked] = useState(false);
      const [isCorrect, setIsCorrect] = useState(false);
      const [isRandomOrder, setIsRandomOrder] = useState(false);
      const [shuffledQuestions, setShuffledQuestions] = useState([]);

      useEffect(() => {
        if (isRandomOrder) {
          setShuffledQuestions([...questions].sort(() => Math.random() - 0.5));
        } else {
          setShuffledQuestions(questions);
        }
        setCurrentIndex(0);
      }, [questions, isRandomOrder]);

      const activeQuestions = isRandomOrder ? shuffledQuestions : questions;
      const q = activeQuestions[currentIndex];

      useEffect(() => {
        if (!q) return;
        setIsChecked(false);
        setIsCorrect(false);
        setSelectedChips([]);

        const words = q.en.split(/\s+/).map((word, idx) => ({
          id: `${idx}-${word}`,
          text: word
        }));

        const shuffled = [...words].sort(() => Math.random() - 0.5);
        setAvailableChips(shuffled);
      }, [q, currentIndex]);

      if (!activeQuestions || activeQuestions.length === 0) {
        return (
          <div className="bg-slate-800/80 border border-slate-700 rounded-2xl p-12 text-center text-slate-400">
            <p>該当する問題がありません。</p>
          </div>
        );
      }

      const handleAddChip = (chip) => {
        if (isChecked) return;
        setAvailableChips(prev => prev.filter(c => c.id !== chip.id));
        setSelectedChips(prev => [...prev, chip]);
      };

      const handleRemoveChip = (chip) => {
        if (isChecked) return;
        setSelectedChips(prev => prev.filter(c => c.id !== chip.id));
        setAvailableChips(prev => [...prev, chip]);
      };

      const handleReset = () => {
        if (isChecked || !q) return;
        const words = q.en.split(/\s+/).map((word, idx) => ({ id: `${idx}-${word}`, text: word }));
        setSelectedChips([]);
        setAvailableChips(words.sort(() => Math.random() - 0.5));
      };

      const handleCheck = () => {
        if (selectedChips.length === 0) return;
        const userSentence = selectedChips.map(c => c.text).join(" ");
        const correct = normalizeStr(userSentence) === normalizeStr(q.en);

        setIsChecked(true);
        setIsCorrect(correct);
        recordResult(correct);

        if (!correct) {
          addMistake(q.id);
        } else {
          removeMistake(q.id);
          speakText(q.en);
        }
      };

      const handleNext = () => {
        if (currentIndex < activeQuestions.length - 1) {
          setCurrentIndex(prev => prev + 1);
        }
      };

      useEnterToNext(isChecked, handleNext);

      const handlePrev = () => {
        if (currentIndex > 0) {
          setCurrentIndex(prev => prev - 1);
        }
      };

      return (
        <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-4 sm:p-8 shadow-xl flex flex-col justify-between flex-1">
          <div>
            <div className="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-slate-700/60 mb-6">
              <div className="flex items-center gap-2">
                <span className="bg-slate-700 text-indigo-300 font-bold text-xs px-3 py-1 rounded-md">
                  P.{q.page} - {q.num}
                </span>
                <span className="text-xs font-bold text-amber-400 bg-amber-950/60 border border-amber-800 px-2.5 py-1 rounded-md">
                  語句並べ替え
                </span>
                <button
                  onClick={() => setIsRandomOrder(!isRandomOrder)}
                  className={`px-3 py-1 rounded-md text-xs font-bold transition flex items-center gap-1.5 border ${
                    isRandomOrder
                      ? "bg-purple-600 border-purple-400 text-white shadow"
                      : "bg-slate-900 border-slate-700 text-slate-400 hover:text-slate-200"
                  }`}
                >
                  <i className="fa-solid fa-shuffle"></i>
                  {isRandomOrder ? "出題順: ランダム" : "出題順: 順番通り"}
                </button>
              </div>
              <span className="text-slate-400 text-sm font-semibold">
                問題 {currentIndex + 1} / {activeQuestions.length}
              </span>
            </div>

            <div className="mb-6">
              <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">日本語訳</span>
              <div className="flex items-center justify-between gap-3"><h2 className="text-xl sm:text-2xl font-bold text-slate-100 leading-relaxed">{q.jp}</h2><DogForQuestion q={q} /></div>
              {q.hint && (
                <div className="mt-2 text-xs font-mono text-amber-300">
                  指定語句: [{q.hint}]
                </div>
              )}
            </div>

            <div className="mb-6">
              <div className="text-xs font-bold text-slate-400 mb-2 flex items-center justify-between">
                <span>作成英文:</span>
                <button
                  onClick={handleReset}
                  disabled={isChecked || selectedChips.length === 0}
                  className="text-xs text-indigo-400 hover:text-indigo-300 disabled:opacity-40 flex items-center gap-1"
                >
                  <i className="fa-solid fa-rotate"></i> リセット
                </button>
              </div>

              <div className="min-h-[90px] p-4 bg-slate-900 border-2 border-dashed border-slate-700 rounded-2xl flex flex-wrap gap-2 items-center">
                {selectedChips.length === 0 ? (
                  <span className="text-slate-500 text-sm italic">
                    下の単語カードをタップして正しい順番に並べてください
                  </span>
                ) : (
                  selectedChips.map(chip => (
                    <button
                      key={chip.id}
                      onClick={() => handleRemoveChip(chip)}
                      disabled={isChecked}
                      className="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-base rounded-xl shadow transition transform active:scale-95"
                    >
                      {chip.text}
                    </button>
                  ))
                )}
              </div>
            </div>

            <div className="mb-6">
              <div className="text-xs font-bold text-slate-400 mb-2">単語リスト:</div>
              <div className="flex flex-wrap gap-2 min-h-[60px] p-2">
                {availableChips.map(chip => (
                  <button
                    key={chip.id}
                    onClick={() => handleAddChip(chip)}
                    disabled={isChecked}
                    className="px-3.5 py-2 bg-slate-700 hover:bg-slate-600 text-slate-100 font-bold text-base rounded-xl border border-slate-600 shadow-sm transition transform active:scale-95"
                  >
                    {chip.text}
                  </button>
                ))}
              </div>
            </div>

            {!isChecked && (
              <button
                onClick={handleCheck}
                disabled={selectedChips.length === 0}
                className="w-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 text-base"
              >
                <i className="fa-solid fa-circle-check"></i> 並べ替えをチェック
              </button>
            )}

            {isChecked && (
              <div className={`p-5 rounded-xl border ${
                isCorrect ? "bg-emerald-950/60 border-emerald-500/50 text-emerald-200" : "bg-rose-950/60 border-rose-500/50 text-rose-200"
              }`}>
                <div className="flex items-center justify-between mb-2">
                  <div className="font-bold text-lg flex items-center gap-2">
                    {isCorrect ? (
                      <>
                        <i className="fa-solid fa-circle-check text-emerald-400"></i>
                        <span className="text-emerald-400">正解です！ Great!</span>
                      </>
                    ) : (
                      <>
                        <i className="fa-solid fa-circle-xmark text-rose-400"></i>
                        <span className="text-rose-400">不正解... 正解を確認してください。</span>
                      </>
                    )}
                  </div>

                  <button
                    onClick={() => speakText(q.en)}
                    className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold rounded-lg flex items-center gap-1.5 border border-slate-600"
                  >
                    <i className="fa-solid fa-volume-high text-indigo-400"></i> 音声
                  </button>
                </div>
                <div className="mt-2">
                  <span className="text-slate-400 text-xs font-bold block">正解英文:</span>
                  <div className="flex items-center justify-between gap-3"><p className="font-mono font-bold text-white text-lg">{q.en}</p><DogForQuestion q={q} size={58} /></div>
                </div>
              </div>
            )}
          </div>

          <div className="flex items-center justify-between mt-8 pt-4 border-t border-slate-700/60">
            <button
              onClick={handlePrev}
              disabled={currentIndex === 0}
              className="px-4 py-2.5 bg-slate-700 hover:bg-slate-600 disabled:opacity-40 text-slate-200 font-bold rounded-xl text-sm transition"
            >
              <i className="fa-solid fa-arrow-left"></i> 前へ
            </button>

            <span className="text-xs text-slate-400 font-bold">
              {currentIndex + 1} / {activeQuestions.length}
            </span>

            <button
              onClick={handleNext}
              disabled={currentIndex === activeQuestions.length - 1}
              className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 text-white font-bold rounded-xl text-sm transition"
            >
              次へ <i className="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </div>
      );
    }

    // ----------------------------------------------------
    // Mode 3: Word Position Quiz Mode
    // ----------------------------------------------------
    function WordPositionMode({ questions, addMistake, removeMistake, recordResult }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [isChecked, setIsChecked] = useState(false);
      const [isRandomOrder, setIsRandomOrder] = useState(false);
      const [shuffledQuestions, setShuffledQuestions] = useState([]);

      useEffect(() => {
        if (isRandomOrder) {
          setShuffledQuestions([...questions].sort(() => Math.random() - 0.5));
        } else {
          setShuffledQuestions(questions);
        }
        setCurrentIndex(0);
      }, [questions, isRandomOrder]);

      const activeQuestions = isRandomOrder ? shuffledQuestions : questions;
      const q = activeQuestions[currentIndex];

      useEffect(() => {
        setIsChecked(false);
        setSelectedOption(null);
      }, [currentIndex, q]);

      if (!activeQuestions || activeQuestions.length === 0 || !q) {
        return (
          <div className="bg-slate-800/80 border border-slate-700 rounded-2xl p-12 text-center text-slate-400">
            <p>該当する問題がありません。</p>
          </div>
        );
      }

      const words = q.en.split(/\s+/);
      const cleanTarget = (q.targetWord || words[0]).replace(/[.,?!'"]/g, "");
      
      let correctPos = words.findIndex(w => w.replace(/[.,?!'"]/g, "").toLowerCase() === cleanTarget.toLowerCase()) + 1;
      if (correctPos === 0) correctPos = 1;

      const options = (() => {
        const total = words.length;
        const setPos = new Set([correctPos]);
        const candidates = [correctPos - 1, correctPos + 1, correctPos + 2, correctPos - 2, 1, 2, 3, 4, 5, total];
        for (let p of candidates) {
          if (p >= 1 && p <= total) setPos.add(p);
          if (setPos.size === 4) break;
        }
        let optArr = Array.from(setPos);
        while (optArr.length < 4 && optArr.length < total) {
          for (let i = 1; i <= total; i++) {
            if (!optArr.includes(i)) { optArr.push(i); break; }
          }
        }
        return optArr.sort((a, b) => a - b);
      })();

      const handleSelectOption = (opt) => {
        if (isChecked) return;
        setSelectedOption(opt);
        setIsChecked(true);
        const isCorrect = (opt === correctPos);
        recordResult(isCorrect);
        if (!isCorrect) {
          addMistake(q.id);
        } else {
          removeMistake(q.id);
          speakText(q.en);
        }
      };

      const handleNext = () => {
        if (currentIndex < activeQuestions.length - 1) {
          setCurrentIndex(prev => prev + 1);
        }
      };

      useEnterToNext(isChecked, handleNext);

      const handlePrev = () => {
        if (currentIndex > 0) {
          setCurrentIndex(prev => prev - 1);
        }
      };

      return (
        <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-4 sm:p-8 shadow-xl flex flex-col justify-between flex-1">
          <div>
            <div className="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-slate-700/60 mb-6">
              <div className="flex items-center gap-2">
                <span className="bg-slate-700 text-indigo-300 font-bold text-xs px-3 py-1 rounded-md">
                  P.{q.page} - {q.num}
                </span>
                <span className="text-xs font-bold text-teal-300 bg-teal-950/80 border border-teal-800 px-2.5 py-1 rounded-md">
                  語順位置当て
                </span>
                <button
                  onClick={() => setIsRandomOrder(!isRandomOrder)}
                  className={`px-3 py-1 rounded-md text-xs font-bold transition flex items-center gap-1.5 border ${
                    isRandomOrder
                      ? "bg-purple-600 border-purple-400 text-white shadow"
                      : "bg-slate-900 border-slate-700 text-slate-400 hover:text-slate-200"
                  }`}
                >
                  <i className="fa-solid fa-shuffle"></i>
                  {isRandomOrder ? "出題順: ランダム" : "出題順: 順番通り"}
                </button>
              </div>
              <span className="text-slate-400 text-sm font-semibold">
                問題 {currentIndex + 1} / {activeQuestions.length}
              </span>
            </div>

            <div className="mb-6 space-y-3">
              <span className="text-xs font-bold text-slate-400 uppercase tracking-wider block">日本語訳</span>
              <div className="flex items-center justify-between gap-3"><h2 className="text-xl sm:text-2xl font-bold text-slate-100 leading-relaxed">{q.jp}</h2><DogForQuestion q={q} /></div>

              <div className="p-4 bg-slate-900/90 border border-teal-500/30 rounded-xl">
                <p className="text-sm sm:text-base text-slate-200 font-medium">
                  英文にした際、指定の単語 <span className="font-mono font-black text-amber-300 text-xl mx-1">『{cleanTarget}』</span> は<br className="hidden sm:inline"/>
                  先頭から数えて<strong className="text-teal-400">何番目</strong>の単語になりますか？
                </p>
              </div>
            </div>

            <div className="grid grid-cols-2 gap-3 mb-6">
              {options.map((opt) => {
                let btnStyle = "bg-slate-900 hover:bg-slate-700 text-white border-slate-700";
                if (isChecked) {
                  if (opt === correctPos) {
                    btnStyle = "bg-emerald-900/90 border-emerald-400 text-emerald-200 shadow-lg shadow-emerald-900/50";
                  } else if (opt === selectedOption) {
                    btnStyle = "bg-rose-900/90 border-rose-400 text-rose-200";
                  } else {
                    btnStyle = "bg-slate-900/40 border-slate-800 text-slate-600 opacity-50";
                  }
                }
                return (
                  <button
                    key={opt}
                    onClick={() => handleSelectOption(opt)}
                    disabled={isChecked}
                    className={`p-4 border-2 rounded-xl text-lg sm:text-xl font-bold transition flex items-center justify-center gap-2 ${btnStyle}`}
                  >
                    <span>{opt} 番目</span>
                    {isChecked && opt === correctPos && <i className="fa-solid fa-circle-check text-emerald-400"></i>}
                    {isChecked && opt === selectedOption && opt !== correctPos && <i className="fa-solid fa-circle-xmark text-rose-400"></i>}
                  </button>
                );
              })}
            </div>

            {isChecked && (
              <div className={`p-5 rounded-xl border ${
                selectedOption === correctPos ? "bg-emerald-950/60 border-emerald-500/50 text-emerald-200" : "bg-rose-950/60 border-rose-500/50 text-rose-200"
              }`}>
                <div className="flex items-center justify-between mb-3">
                  <div className="font-bold text-lg flex items-center gap-2">
                    {selectedOption === correctPos ? (
                      <span className="text-emerald-400"><i className="fa-solid fa-circle-check"></i> 正解！ 正しい位置を見抜けています。</span>
                    ) : (
                      <span className="text-rose-400"><i className="fa-solid fa-circle-xmark"></i> 不正解... 正解は {correctPos} 番目です。</span>
                    )}
                  </div>
                  <button
                    onClick={() => speakText(q.en)}
                    className="px-3 py-1 bg-slate-800 text-white text-xs font-bold rounded-lg"
                  >
                    <i className="fa-solid fa-volume-high text-teal-300"></i> 音声
                  </button>
                </div>

                <div className="mt-2 space-y-2">
                  <div className="text-xs text-slate-400 font-bold">単語の位置一覧:</div>
                  <div className="flex flex-wrap gap-1.5 p-3 bg-slate-900/80 rounded-lg text-xs font-mono">
                    {words.map((w, idx) => {
                      const pos = idx + 1;
                      const isTarget = pos === correctPos;
                      return (
                        <span
                          key={idx}
                          className={`px-2 py-1 rounded border ${
                            isTarget
                              ? "bg-amber-400 text-slate-950 border-amber-300 font-extrabold"
                              : "bg-slate-800 text-slate-300 border-slate-700"
                          }`}
                        >
                          <span className="text-[10px] text-slate-500 mr-1">{pos}.</span>
                          {w}
                        </span>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}
          </div>

          <div className="flex items-center justify-between mt-8 pt-4 border-t border-slate-700/60">
            <button
              onClick={handlePrev}
              disabled={currentIndex === 0}
              className="px-4 py-2.5 bg-slate-700 hover:bg-slate-600 disabled:opacity-40 text-slate-200 font-bold rounded-xl text-sm transition"
            >
              <i className="fa-solid fa-arrow-left"></i> 前へ
            </button>

            <span className="text-xs text-slate-400 font-bold">
              {currentIndex + 1} / {activeQuestions.length}
            </span>

            <button
              onClick={handleNext}
              disabled={currentIndex === activeQuestions.length - 1}
              className="px-5 py-2.5 bg-teal-600 hover:bg-teal-500 disabled:opacity-40 text-white font-bold rounded-xl text-sm transition shadow-md shadow-teal-600/20"
            >
              次へ <i className="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </div>
      );
    }

    // ----------------------------------------------------
    // Mode 4: Underlined phrase multiple-choice practice
    // ----------------------------------------------------
    function ErrorSpottingMode({ questions, addMistake, removeMistake, recordResult }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [selectedChoice, setSelectedChoice] = useState(null);
      const [isChecked, setIsChecked] = useState(false);
      const [isRandomOrder, setIsRandomOrder] = useState(false);
      const [shuffledQuestions, setShuffledQuestions] = useState([]);

      useEffect(() => {
        setShuffledQuestions(isRandomOrder ? [...questions].sort(() => Math.random() - 0.5) : questions);
        setCurrentIndex(0);
      }, [questions, isRandomOrder]);

      const activeQuestions = isRandomOrder ? shuffledQuestions : questions;
      const q = activeQuestions[currentIndex];
      useEffect(() => { setIsChecked(false); setSelectedChoice(null); }, [currentIndex, q]);
      useEnterToNext(isChecked, () => setCurrentIndex(i => Math.min(i + 1, activeQuestions.length - 1)));

      if (!q) return <div className="bg-slate-800 border border-slate-700 rounded-2xl p-12 text-center text-slate-300">該当する問題がありません。</div>;

      const target = q.targetWord || q.en.split(/\s+/)[0].replace(/[.,?!'"]/g, '');
      const targetPattern = new RegExp(`(${target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'i');
      const match = q.en.match(targetPattern);
      const targetText = match ? match[0] : target;
      const distractors = new Set();
      if (/^\d+$/.test(targetText)) { const n = Number(targetText); distractors.add(String(n - 1)); distractors.add(String(n + 1)); distractors.add(String(n + 10)); }
      else if (/ing$/i.test(targetText)) { distractors.add(targetText.replace(/ing$/i, '')); distractors.add(targetText.replace(/ing$/i, 'ed')); distractors.add(targetText.replace(/ing$/i, 's')); }
      else if (/ed$/i.test(targetText)) { distractors.add(targetText.replace(/ed$/i, '')); distractors.add(targetText.replace(/ed$/i, 'ing')); distractors.add(targetText.replace(/ed$/i, 's')); }
      else if (/s$/i.test(targetText)) { distractors.add(targetText.replace(/s$/i, '')); distractors.add(targetText + 'ed'); distractors.add(targetText + 'ing'); }
      else { distractors.add(targetText + 's'); distractors.add(targetText + 'ed'); distractors.add(targetText + 'ing'); }
      const options = [targetText, ...[...distractors].filter(x => x && x.toLowerCase() !== targetText.toLowerCase()).slice(0, 3)];
      while (options.length < 4) options.push(targetText + (options.length === 1 ? 'ly' : 'ness'));
      const shuffledOptions = useMemo(() => {
        const seed = [...options];
        // Rotate choices per question so the correct answer does not stay in the same position.
        const shift = (Number(q.id.split('-')[0]) + q.id.charCodeAt(q.id.length - 1)) % seed.length;
        return seed.slice(shift).concat(seed.slice(0, shift));
      }, [q.id, targetText]);
      const correctIndex = shuffledOptions.findIndex(x => x.toLowerCase() === targetText.toLowerCase());
      const wrongText = shuffledOptions.find((x, i) => i !== correctIndex) || `${targetText}x`;
      const labels = ['A', 'B', 'C', 'D'];
      const choose = (index) => {
        if (isChecked) return;
        setSelectedChoice(index); setIsChecked(true);
        const correct = index === correctIndex;
        recordResult(correct);
        if (correct) { removeMistake(q.id); speakText(q.en); } else addMistake(q.id);
      };
      const move = (delta) => { setCurrentIndex(i => Math.max(0, Math.min(activeQuestions.length - 1, i + delta))); };

      return (
        <section className="bg-slate-800/90 border border-slate-600 rounded-2xl p-5 sm:p-8 shadow-xl">
          <div className="flex flex-wrap items-center justify-between gap-3 pb-5 border-b border-slate-600 mb-6">
            <div className="flex flex-wrap items-center gap-2">
              <span className="bg-slate-700 text-indigo-200 font-bold text-xs px-3 py-1.5 rounded-lg">P.{q.page}・{q.num}</span>
              <span className="text-xs font-bold text-rose-200 bg-rose-950 border border-rose-700 px-3 py-1.5 rounded-lg">下線部の訂正</span>
              <button onClick={() => setIsRandomOrder(v => !v)} className="px-3 py-1.5 rounded-lg text-xs font-bold border border-slate-600 bg-slate-900 text-slate-200 hover:bg-slate-700">{isRandomOrder ? '🔀 ランダム順' : '順番通り'}</button>
            </div>
            <span className="text-slate-300 text-sm font-semibold">問題 {currentIndex + 1} / {activeQuestions.length}</span>
          </div>
          <div className="mb-6">
            <div className="text-xs font-bold text-slate-400 mb-2">日本語訳</div>
            <div className="flex items-center justify-between gap-3"><h2 className="text-xl sm:text-2xl font-bold text-white leading-relaxed">{q.jp}</h2><DogForQuestion q={q} /></div>
          </div>
          <div className="rounded-2xl bg-slate-950 border border-indigo-400/50 p-5 sm:p-7 mb-6">
            <div className="text-xs font-bold text-rose-300 mb-3">英文（誤りは1か所）</div>
            <div className="flex items-center justify-between gap-3"><p className="text-lg sm:text-2xl leading-loose font-semibold text-white">{match ? <>{q.en.slice(0, match.index)}<u className="decoration-rose-400 decoration-4 underline-offset-8 text-rose-100">{wrongText}</u>{q.en.slice(match.index + targetText.length)}</> : q.en}</p><DogForQuestion q={q} size={58} /></div>
            <p className="text-sm text-slate-300 mt-4">下線部の誤りを正しく直す選択肢を選びましょう。</p>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {shuffledOptions.map((option, index) => {
              const isAnswer = index === correctIndex;
              const selected = index === selectedChoice;
              let style = 'bg-slate-900 border-slate-600 text-white hover:border-indigo-400 hover:bg-slate-700';
              if (isChecked && isAnswer) style = 'bg-emerald-950 border-emerald-400 text-emerald-100';
              else if (isChecked && selected) style = 'bg-rose-950 border-rose-400 text-rose-100';
              return <button key={`${option}-${index}`} onClick={() => choose(index)} disabled={isChecked} className={`min-h-14 p-4 border-2 rounded-xl text-left font-semibold text-lg transition flex items-center gap-3 ${style}`}><span className="rounded-lg bg-slate-700 px-3 py-1 text-sm font-black">{labels[index]}</span><span>{option}</span>{isChecked && isAnswer && <i className="fa-solid fa-circle-check ml-auto text-emerald-300"></i>}</button>;
            })}
          </div>
          {isChecked && <div className={`mt-6 p-5 rounded-xl border ${selectedChoice === correctIndex ? 'bg-emerald-950/70 border-emerald-500 text-emerald-100' : 'bg-rose-950/70 border-rose-500 text-rose-100'}`}>
            <div className="font-bold text-lg mb-2">{selectedChoice === correctIndex ? '正解です！' : `不正解。正解は ${labels[correctIndex]} です。`}</div>
            <div className="text-sm text-slate-200">正しい英文</div><div className="flex items-center justify-between gap-3"><p className="font-mono text-white text-base sm:text-lg mt-1">{q.en}</p><DogForQuestion q={q} size={58} /></div>
            <button onClick={() => speakText(q.en)} className="mt-3 px-4 py-2 bg-slate-800 rounded-lg text-sm font-bold"><i className="fa-solid fa-volume-high mr-2 text-indigo-300"></i>音声</button>
          </div>}
          <div className="flex items-center justify-between mt-7 pt-5 border-t border-slate-600">
            <button onClick={() => move(-1)} disabled={currentIndex === 0} className="px-4 py-3 rounded-xl bg-slate-700 text-white font-bold disabled:opacity-40">← 前へ</button>
            <button onClick={() => move(1)} disabled={currentIndex === activeQuestions.length - 1} className="px-5 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold disabled:opacity-40">次へ →</button>
          </div>
        </section>
      );
    }

    // ----------------------------------------------------
    // Mode 5: Random Quiz Challenge
    // ----------------------------------------------------
    function RandomQuizMode({ questions, addMistake, removeMistake, recordResult }) {
      const [quizState, setQuizState] = useState("setup");
      const [quizCount, setQuizCount] = useState(10);
      const [quizPool, setQuizPool] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [userAnswer, setUserAnswer] = useState("");
      const [results, setResults] = useState([]);
      const [isAnswered, setIsAnswered] = useState(false);

      const startQuiz = (count) => {
        if (!questions || questions.length === 0) return;
        const shuffled = [...questions].sort(() => Math.random() - 0.5);
        const selected = shuffled.slice(0, Math.min(count, questions.length));
        setQuizCount(selected.length);
        setQuizPool(selected);
        setCurrentIndex(0);
        setUserAnswer("");
        setResults([]);
        setIsAnswered(false);
        setQuizState("playing");
      };

      const q = quizPool[currentIndex];

      const handleCheck = (e) => {
        if (e) e.preventDefault();
        if (!userAnswer.trim() || !q) return;

        const isCorrect = 
          normalizeStr(userAnswer) === normalizeStr(q.en) ||
          (q.blankTarget && normalizeStr(userAnswer) === normalizeStr(q.blankTarget)) ||
          (q.targetWord && normalizeStr(userAnswer) === normalizeStr(q.targetWord));

        setIsAnswered(true);
        recordResult(isCorrect);

        const recordItem = { question: q, userAns: userAnswer, isCorrect };
        setResults(prev => [...prev, recordItem]);

        if (!isCorrect) {
          addMistake(q.id);
        } else {
          removeMistake(q.id);
          speakText(q.en);
        }
      };

      const handleNextQuestion = () => {
        setIsAnswered(false);
        setUserAnswer("");
        if (currentIndex < quizPool.length - 1) {
          setCurrentIndex(prev => prev + 1);
        } else {
          setQuizState("summary");
        }
      };

      useEnterToNext(isAnswered, handleNextQuestion);

      if (quizState === "setup") {
        return (
          <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 sm:p-12 shadow-xl text-center">
            <div className="w-16 h-16 bg-purple-950/80 border border-purple-500/30 text-purple-400 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">
              <i className="fa-solid fa-dice"></i>
            </div>
            <h2 className="text-2xl sm:text-3xl font-black text-white mb-2">ランダムテスト・チャレンジ</h2>
            <p className="text-slate-400 text-sm max-w-lg mx-auto mb-8">
              選択された問題（{questions.length}問）からランダムでシャッフル出題します。コースを選択してスタート！
            </p>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 max-w-xl mx-auto mb-8">
              <button
                onClick={() => startQuiz(10)}
                disabled={questions.length === 0}
                className="p-5 bg-slate-900 hover:bg-purple-950/70 border border-slate-700 hover:border-purple-500 rounded-2xl transition group text-left"
              >
                <div className="text-purple-400 font-extrabold text-lg mb-1 group-hover:scale-105 transition transform">⚡ 10問コース</div>
                <div className="text-slate-400 text-xs">サクッと短時間でテスト</div>
              </button>

              <button
                onClick={() => startQuiz(20)}
                disabled={questions.length < 5}
                className="p-5 bg-slate-900 hover:bg-purple-950/70 border border-slate-700 hover:border-purple-500 rounded-2xl transition group text-left"
              >
                <div className="text-purple-400 font-extrabold text-lg mb-1 group-hover:scale-105 transition transform">🔥 20問コース</div>
                <div className="text-slate-400 text-xs">しっかり実力チェック</div>
              </button>

              <button
                onClick={() => startQuiz(questions.length)}
                disabled={questions.length === 0}
                className="p-5 bg-slate-900 hover:bg-purple-950/70 border border-slate-700 hover:border-purple-500 rounded-2xl transition group text-left"
              >
                <div className="text-purple-400 font-extrabold text-lg mb-1 group-hover:scale-105 transition transform">🏆 全問挑戦 ({questions.length}問)</div>
                <div className="text-slate-400 text-xs">対象範囲の完全網羅</div>
              </button>
            </div>
          </div>
        );
      }

      if (quizState === "summary") {
        const correctCount = results.filter(r => r.isCorrect).length;
        const scorePercent = Math.round((correctCount / results.length) * 100);

        let rank = "S";
        if (scorePercent < 60) rank = "C";
        else if (scorePercent < 80) rank = "B";
        else if (scorePercent < 95) rank = "A";

        return (
          <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 sm:p-10 shadow-xl text-center">
            <div className="inline-block px-4 py-1.5 bg-purple-950 text-purple-300 border border-purple-800 rounded-full text-xs font-extrabold mb-4">
              テスト完了！ RESULT
            </div>

            <div className="text-5xl font-black text-white mb-2">
              {scorePercent}<span className="text-2xl text-purple-400">%</span>
            </div>

            <p className="text-slate-300 text-base font-bold mb-6">
              正解数: <span className="text-emerald-400 font-extrabold text-xl">{correctCount}</span> / {results.length}問 (ランク <span className="text-amber-400 font-black text-xl">{rank}</span>)
            </p>

            <div className="max-w-2xl mx-auto bg-slate-900/90 rounded-2xl p-4 sm:p-6 mb-8 text-left border border-slate-700">
              <h3 className="text-sm font-bold text-slate-300 mb-4 pb-2 border-b border-slate-800">
                出題結果リスト:
              </h3>
              <div className="space-y-3 max-h-72 overflow-y-auto custom-scrollbar pr-1">
                {results.map((res, idx) => (
                  <div
                    key={idx}
                    className="p-3 bg-slate-800/80 rounded-xl border border-slate-700/80 flex items-center justify-between text-xs sm:text-sm"
                  >
                    <div className="space-y-0.5">
                      <div className="flex items-center gap-2">
                        <span className="text-slate-400 font-bold">Q{idx + 1}. P.{res.question.page}</span>
                        <span className={res.isCorrect ? "text-emerald-400 font-bold" : "text-rose-400 font-bold"}>
                          {res.isCorrect ? "◯ 正解" : "✕ 不正解"}
                        </span>
                      </div>
                      <div className="text-slate-200 font-semibold">{res.question.jp}</div>
                      <div className="text-indigo-300 font-mono">{res.question.en}</div>
                    </div>
                    <button
                      onClick={() => speakText(res.question.en)}
                      className="p-2 bg-slate-700 text-slate-300 rounded-lg hover:text-white shrink-0 ml-2"
                    >
                      <i className="fa-solid fa-volume-high"></i>
                    </button>
                  </div>
                ))}
              </div>
            </div>

            <div className="flex justify-center gap-4">
              <button
                onClick={() => setQuizState("setup")}
                className="px-6 py-3 bg-purple-600 hover:bg-purple-500 text-white font-bold text-base rounded-xl transition shadow-lg shadow-purple-600/30 flex items-center gap-2"
              >
                <i className="fa-solid fa-rotate-right"></i> もう一度挑戦
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-4 sm:p-8 shadow-xl flex flex-col justify-between flex-1">
          <div>
            <div className="flex items-center justify-between pb-4 border-b border-slate-700/60 mb-6">
              <div className="flex items-center gap-2">
                <span className="bg-purple-950 text-purple-300 border border-purple-800 font-bold text-xs px-3 py-1 rounded-md">
                  P.{q.page} - {q.num}
                </span>
                <span className="text-xs font-bold text-slate-400">
                  ランダム出題
                </span>
              </div>
              <span className="text-purple-300 text-sm font-extrabold">
                問題 {currentIndex + 1} / {quizPool.length}
              </span>
            </div>

            <div className="space-y-4 mb-6">
              <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">日本語訳</div>
              <div className="flex items-center justify-between gap-3"><h2 className="text-xl sm:text-2xl font-bold text-slate-100 leading-relaxed">{q.jp}</h2><DogForQuestion q={q} /></div>
              {q.hint && (
                <div className="text-xs font-mono text-amber-300">
                  指定語句: [{q.hint}]
                </div>
              )}
            </div>

            <form onSubmit={handleCheck} className="space-y-4">
              <div>
                <label className="block text-xs font-bold text-slate-400 mb-2">
                  英語を入力してください:
                </label>
                <input
                  type="text"
                  value={userAnswer}
                  onChange={(e) => setUserAnswer(e.target.value)}
                  placeholder="英文またはキー語句を入力..."
                  disabled={isAnswered}
                  className="w-full bg-slate-900 border-2 border-slate-700 focus:border-purple-500 rounded-xl px-4 py-3.5 text-base sm:text-lg text-white placeholder-slate-500 outline-none transition"
                  autoFocus
                />
              </div>

              {!isAnswered && (
                <button
                  type="submit"
                  disabled={!userAnswer.trim()}
                  className="w-full bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-purple-600/30 flex items-center justify-center gap-2 text-base"
                >
                  <i className="fa-solid fa-check"></i> 判定する
                </button>
              )}
            </form>

            {isAnswered && (
              <div className={`mt-6 p-5 rounded-xl border ${
                results[results.length - 1]?.isCorrect ? "bg-emerald-950/60 border-emerald-500/50 text-emerald-200" : "bg-rose-950/60 border-rose-500/50 text-rose-200"
              }`}>
                <div className="flex items-center justify-between mb-2">
                  <div className="font-bold text-lg flex items-center gap-2">
                    {results[results.length - 1]?.isCorrect ? (
                      <span className="text-emerald-400">正解！ Perfect!</span>
                    ) : (
                      <span className="text-rose-400">不正解... 次で取り返そう！</span>
                    )}
                  </div>
                  <button
                    onClick={() => speakText(q.en)}
                    className="px-3 py-1 bg-slate-800 text-white text-xs font-bold rounded-lg"
                  >
                    <i className="fa-solid fa-volume-high text-purple-300"></i> 音声
                  </button>
                </div>
                <div>
                  <span className="text-slate-400 text-xs font-bold block">正解英文:</span>
                  <div className="flex items-center justify-between gap-3"><p className="font-mono font-bold text-white text-lg">{q.en}</p><DogForQuestion q={q} size={58} /></div>
                </div>
              </div>
            )}
          </div>

          <div className="flex justify-end mt-8 pt-4 border-t border-slate-700/60">
            {isAnswered && (
              <button
                onClick={handleNextQuestion}
                className="px-6 py-3 bg-purple-600 hover:bg-purple-500 text-white font-bold text-sm sm:text-base rounded-xl transition shadow-lg shadow-purple-600/30 flex items-center gap-2"
              >
                {currentIndex < quizPool.length - 1 ? "次の問題へ" : "結果を見る"} <i className="fa-solid fa-arrow-right"></i>
              </button>
            )}
          </div>
        </div>
      );
    }

    // ----------------------------------------------------
    // Mode 6: Mistake Review
    // ----------------------------------------------------
    function MistakeReviewMode({ allQuestions, mistakeIds, removeMistake, clearAllMistakes, recordResult }) {
      const mistakeQuestions = useMemo(() => {
        return allQuestions.filter(q => mistakeIds.includes(q.id));
      }, [allQuestions, mistakeIds]);

      const [practiceMode, setPracticeMode] = useState(false);

      if (mistakeQuestions.length === 0) {
        return (
          <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-12 text-center shadow-xl">
            <div className="w-16 h-16 bg-emerald-950/80 border border-emerald-500/30 text-emerald-400 rounded-full flex items-center justify-center text-2xl mx-auto mb-4">
              <i className="fa-solid fa-trophy"></i>
            </div>
            <h2 className="text-2xl font-black text-white mb-2">素晴らしい！間違いリストは空です</h2>
            <p className="text-slate-400 text-sm max-w-md mx-auto">
              テスト演習中に間違えた問題がここに自動蓄積されます。
            </p>
          </div>
        );
      }

      if (practiceMode) {
        return (
          <div className="space-y-4">
            <div className="flex items-center justify-between bg-slate-800 p-4 rounded-xl border border-slate-700">
              <span className="text-amber-400 font-bold text-sm">
                <i className="fa-solid fa-rotate-left mr-2"></i>復習リストを再テスト中 ({mistakeQuestions.length}問)
              </span>
              <button
                onClick={() => setPracticeMode(false)}
                className="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold rounded-lg"
              >
                リストへ戻る
              </button>
            </div>
            <FillInMode
              questions={mistakeQuestions}
              addMistake={() => {}}
              removeMistake={removeMistake}
              recordResult={recordResult}
            />
          </div>
        );
      }

      return (
        <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-4 sm:p-8 shadow-xl">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-slate-700/60 mb-6">
            <div>
              <h2 className="text-xl sm:text-2xl font-black text-white flex items-center gap-2">
                <i className="fa-solid fa-triangle-exclamation text-amber-400"></i>
                間違えた問題リスト ({mistakeQuestions.length}問)
              </h2>
              <p className="text-slate-400 text-xs sm:text-sm mt-1">
                「一括再テスト開始」または個別に復習して苦手問題の克服を目指しましょう。
              </p>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={() => setPracticeMode(true)}
                className="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm rounded-xl transition shadow-md shadow-indigo-600/30 flex items-center gap-2"
              >
                <i className="fa-solid fa-play"></i> 一括再テスト開始
              </button>
              <button
                onClick={clearAllMistakes}
                className="px-3 py-2.5 bg-slate-700 hover:bg-rose-900/80 hover:text-rose-200 text-slate-300 font-bold text-xs rounded-xl transition border border-slate-600"
              >
                リスト消去
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 gap-4 max-h-[500px] overflow-y-auto pr-2 custom-scrollbar">
            {mistakeQuestions.map(q => (
              <div
                key={q.id}
                className="p-4 bg-slate-900/80 border border-slate-700/80 rounded-xl flex flex-col md:flex-row md:items-center justify-between gap-4 hover:border-slate-600 transition"
              >
                <div className="space-y-1">
                  <div className="flex items-center gap-2">
                    <span className="bg-slate-800 text-indigo-300 font-bold text-xs px-2.5 py-0.5 rounded">
                      P.{q.page} - {q.num}
                    </span>
                    {q.hint && (
                      <span className="text-amber-400 font-mono text-xs">
                        [{q.hint}]
                      </span>
                    )}
                  </div>
                  <div className="flex items-center gap-3"><div className="text-slate-200 font-bold text-base">{q.jp}</div><DogForQuestion q={q} size={54} /></div>
                  <div className="flex items-center justify-between gap-3"><div className="text-indigo-300 font-mono font-bold text-sm sm:text-base">{q.en}</div><DogForQuestion q={q} size={48} /></div>
                </div>

                <div className="flex items-center gap-2 self-end md:self-center shrink-0">
                  <button
                    onClick={() => speakText(q.en)}
                    className="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm border border-slate-700"
                    title="音声再生"
                  >

                    <i className="fa-solid fa-volume-high text-indigo-400"></i>
                  </button>

                  <button
                    onClick={() => removeMistake(q.id)}
                    className="px-3 py-2 bg-emerald-950 hover:bg-emerald-900 text-emerald-300 border border-emerald-800 text-xs font-bold rounded-lg flex items-center gap-1.5 transition"
                  >
                    <i className="fa-solid fa-check"></i> 克服した
                  </button>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ----------------------------------------------------
    // Mode 7: Flashcard Mode (Audio & Flip Cards)
    // ----------------------------------------------------
    function FlashcardMode({ questions, mastered, toggleMastered }) {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [speechRate, setSpeechRate] = useState(1.0);
      const [autoPlay, setAutoPlay] = useState(false);
      const [isRandomOrder, setIsRandomOrder] = useState(false);
      const [shuffledQuestions, setShuffledQuestions] = useState([]);

      useEffect(() => {
        if (isRandomOrder) {
          setShuffledQuestions([...questions].sort(() => Math.random() - 0.5));
        } else {
          setShuffledQuestions(questions);
        }
        setCurrentIndex(0);
      }, [questions, isRandomOrder]);

      const activeQuestions = isRandomOrder ? shuffledQuestions : questions;
      const q = activeQuestions[currentIndex];
      useEnterToNext(true, () => setCurrentIndex(i => Math.min(i + 1, activeQuestions.length - 1)));

      useEffect(() => {
        setIsFlipped(false);
      }, [currentIndex, q]);

      useEffect(() => {
        let timer;
        if (autoPlay && q) {
          speakText(q.en, speechRate);
          timer = setTimeout(() => {
            setIsFlipped(true);
            timer = setTimeout(() => {
              if (currentIndex < activeQuestions.length - 1) {
                setCurrentIndex(prev => prev + 1);
              } else {
                setAutoPlay(false);
              }
            }, 3000);
          }, 1500);
        }
        return () => clearTimeout(timer);
      }, [autoPlay, currentIndex, q, speechRate, activeQuestions]);

      if (!activeQuestions || activeQuestions.length === 0 || !q) {
        return (
          <div className="bg-slate-800/80 border border-slate-700 rounded-2xl p-12 text-center text-slate-400">
            <p>該当する問題がありません。</p>
          </div>
        );
      }

      const isItemMastered = mastered.includes(q.id);

      const handleNext = () => {
        if (currentIndex < activeQuestions.length - 1) {
          setCurrentIndex(prev => prev + 1);
        }
      };

      const handlePrev = () => {
        if (currentIndex > 0) {
          setCurrentIndex(prev => prev - 1);
        }
      };

      return (
        <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-4 sm:p-8 shadow-xl flex flex-col justify-between flex-1">
          <div>
            <div className="flex flex-wrap items-center justify-between gap-3 pb-4 border-b border-slate-700/60 mb-6">
              <div className="flex items-center gap-2">
                <span className="bg-emerald-950 text-emerald-400 border border-emerald-800 font-bold text-xs px-3 py-1 rounded-md">
                  P.{q.page} - {q.num}
                </span>
                <button
                  onClick={() => setIsRandomOrder(!isRandomOrder)}
                  className={`px-3 py-1 rounded-md text-xs font-bold transition flex items-center gap-1.5 border ${
                    isRandomOrder
                      ? "bg-purple-600 border-purple-400 text-white shadow"
                      : "bg-slate-900 border-slate-700 text-slate-400 hover:text-slate-200"
                  }`}
                >
                  <i className="fa-solid fa-shuffle"></i>
                  {isRandomOrder ? "出題順: ランダム" : "出題順: 順番通り"}
                </button>
              </div>

              {/* Speech Controls */}
              <div className="flex items-center gap-3">
                <div className="flex items-center gap-1 bg-slate-900 px-2 py-1 rounded-lg border border-slate-700 text-xs">
                  <span className="text-slate-400 font-bold mr-1">速度:</span>
                  {[0.8, 1.0, 1.2].map(r => (
                    <button
                      key={r}
                      onClick={() => setSpeechRate(r)}
                      className={`px-2 py-0.5 rounded font-bold transition ${
                        speechRate === r ? "bg-emerald-600 text-white" : "text-slate-400 hover:text-slate-200"
                      }`}
                    >
                      {r}x
                    </button>
                  ))}
                </div>

                <button
                  onClick={() => setAutoPlay(!autoPlay)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 border ${
                    autoPlay
                      ? "bg-emerald-600 border-emerald-400 text-white shadow"
                      : "bg-slate-900 border-slate-700 text-slate-400 hover:text-slate-200"
                  }`}
                >
                  <i className={`fa-solid ${autoPlay ? 'fa-pause' : 'fa-play'}`}></i>
                  {autoPlay ? "自動再生中" : "自動再生"}
                </button>
              </div>
            </div>

            {/* Flip Card Container */}
            <div
              onClick={() => setIsFlipped(!isFlipped)}
              className="card-flip min-h-[260px] cursor-pointer mb-6 group"
            >
              <div className={`card-inner relative w-full h-full ${isFlipped ? 'card-flipped' : ''}`}>
                {/* Front (Japanese) */}
                <div className="card-front bg-slate-900 border-2 border-slate-700 group-hover:border-slate-500 rounded-2xl p-6 sm:p-10 flex flex-col justify-between shadow-2xl min-h-[260px]">
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-bold text-slate-400 uppercase tracking-widest">表面 : 日本語</span>
                    <button
                      onClick={(e) => { e.stopPropagation(); toggleMastered(q.id); }}
                      className={`text-xl ${isItemMastered ? 'text-amber-400' : 'text-slate-600 hover:text-amber-400'}`}
                      title="マスターに登録"
                    >
                      <i className="fa-solid fa-star"></i>
                    </button>
                  </div>

                  <div className="my-auto text-center py-6">
                    <div className="flex items-center justify-center gap-4"><h3 className="text-xl sm:text-3xl font-extrabold text-white leading-relaxed">{q.jp}</h3><DogForQuestion q={q} size={92} /></div>
                    {q.hint && (
                      <p className="mt-3 text-xs sm:text-sm font-mono text-amber-300">
                        ヒント: [{q.hint}]
                      </p>
                    )}
                  </div>

                  <div className="text-center text-xs text-slate-500 font-bold flex items-center justify-center gap-1">
                    <i className="fa-solid fa-hand-pointer"></i> タップして裏面(英語)を表示
                  </div>
                </div>

                {/* Back (English) */}
                <div className="card-back absolute top-0 left-0 w-full h-full bg-slate-950 border-2 border-emerald-500/50 rounded-2xl p-6 sm:p-10 flex flex-col justify-between shadow-2xl min-h-[260px]">
                  <div className="flex justify-between items-center">
                    <span className="text-xs font-bold text-emerald-400 uppercase tracking-widest">裏面 : 英語</span>
                    <button
                      onClick={(e) => { e.stopPropagation(); speakText(q.en, speechRate); }}
                      className="px-3 py-1 bg-emerald-950 text-emerald-300 border border-emerald-700 rounded-lg text-xs font-bold flex items-center gap-1.5"
                    >
                      <i className="fa-solid fa-volume-high"></i> 音声
                    </button>
                  </div>

                  <div className="my-auto text-center py-6">
                    <div className="flex items-center justify-center gap-4"><p className="text-xl sm:text-3xl font-mono font-extrabold text-emerald-300 leading-relaxed">{q.en}</p><DogForQuestion q={q} size={88} /></div>
                  </div>

                  <div className="text-center text-xs text-slate-500 font-bold">
                    タップで表面に戻る
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div className="flex items-center justify-between mt-4 pt-4 border-t border-slate-700/60">
            <button
              onClick={handlePrev}
              disabled={currentIndex === 0}
              className="px-4 py-2.5 bg-slate-700 hover:bg-slate-600 disabled:opacity-40 text-slate-200 font-bold rounded-xl text-sm transition"
            >
              <i className="fa-solid fa-arrow-left"></i> 前へ
            </button>

            <button
              onClick={() => speakText(q.en, speechRate)}
              className="px-5 py-2.5 bg-slate-900 hover:bg-slate-800 text-emerald-400 border border-emerald-700/60 font-bold rounded-xl text-sm transition flex items-center gap-2 shadow"
            >
              <i className="fa-solid fa-volume-high"></i> 音声を聞く
            </button>

            <button
              onClick={handleNext}
              disabled={currentIndex === activeQuestions.length - 1}
              className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white font-bold rounded-xl text-sm transition shadow-md shadow-emerald-600/20"
            >
              次へ <i className="fa-solid fa-arrow-right"></i>
            </button>
          </div>
        </div>
      );
    }

    // Render the React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

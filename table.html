<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>豪華なテーブル</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #f3e8ff 0%, #ffffff 40%, #f9f5ff 100%);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic Pro", Meiryo, sans-serif;
      color: #3b2b4b;
    }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(248,241,255,0.98));
      border: 1px solid rgba(155, 118, 217, 0.25);
      border-radius: 28px;
      box-shadow: 0 24px 60px rgba(100, 69, 150, 0.14);
      padding: 32px;
      width: min(720px, 90vw);
    }
    h1 {
      margin: 0 0 20px;
      font-size: 2rem;
      letter-spacing: 0.06em;
      text-align: center;
      color: #4e3d6d;
    }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(12px);
    }
    th,
    td {
      padding: 18px 22px;
      text-align: left;
      font-size: 1rem;
    }
    th {
      background: linear-gradient(90deg, #d9c1ff, #f4e2ff);
      color: #4b307d;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-bottom: 2px solid rgba(155, 118, 217, 0.2);
    }
    tr:nth-child(odd) td {
      background: rgba(255, 247, 255, 0.9);
    }
    tr:nth-child(even) td {
      background: rgba(248, 242, 255, 0.72);
    }
    td {
      border-bottom: 1px solid rgba(155, 118, 217, 0.12);
      color: #4c3a6d;
    }
    tr:last-child td {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ここから下は自分で書きました</h1>
    <h3>装飾はAIにやらせました</h3>
    <table>
      <tr>
        <th>名前</th>
        <th>フリガナ</th>
      </tr>
      <tr>
        <td>篠塚</td>
        <td>シノヅカ</td>
      </tr>
      <tr>
        <td>奏汰</td>
        <td>ソウタ</td>
      </tr>
    </table>
  </div>
</body>
</html>

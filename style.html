<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset='utf-8' />
  <meta name="viewport" content="width=device-width" />
  <title>スタイル</title>
  <style>
    strong {color:blue;}
  </style>
</head>

<body>
  <p>
    いずれ花と散る　わたしの<string>生命</string>
帰らぬ時　指おり数えても
涙と笑い　過去と未来
引き裂かれしわたしは　<strong>冬の花</strong>

あなたは太陽　わたしは<strong>月</strong>
光と闇が交じり合わぬように
涙にけむる　ふたりの未来
美しすぎる過去は<strong>蜃気楼</strong>

旅みたいだね
生きるってどんな時でも
木枯らしの中　ぬくもり求め　<strong>彷徨(さまよ)う</strong>

泣かないで　わたしの<strong>恋心</strong>
涙は“お前”にはにあわない
ゆけ　ただゆけ　いっそわたしがゆくよ
ああ　心が笑いたがっている
  </p>
</body>

</html>
